<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workday</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#7a8194;--ac:#4f46e5;--trk:#e8eaf3;--ok:#16a34a;--ln:#eef0f6;--sh:0 4px 24px rgba(30,40,90,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#181b25;--tx:#eef0f6;--mut:#8b92a8;--trk:#272b3a;--ln:#252938;--sh:none;--ac:#818cf8}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#181b25;--tx:#eef0f6;--mut:#8b92a8;--trk:#272b3a;--ln:#252938;--sh:none;--ac:#818cf8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 16px 48px}
h1{margin:0;font-size:28px}.date{color:var(--mut);margin:2px 0 20px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:22px;margin-bottom:18px}
h2{margin:0 0 16px;font-size:17px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:110px}
.big{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}.lbl{color:var(--mut);font-size:13px}
.bar{height:14px;border-radius:99px;background:var(--trk);overflow:hidden;margin:18px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--ac);border-radius:99px;transition:width .6s ease}
.bar.done i{background:var(--ok)}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;background:var(--ac);color:#fff}
button.s{background:var(--trk);color:var(--tx)}button:disabled{opacity:.4;cursor:default}
input,select{font:inherit;color:var(--tx);background:var(--trk);border:0;border-radius:8px;padding:6px 8px}
.done-msg{display:none;align-items:center;gap:8px;color:var(--ok);font-weight:650;margin-top:10px}
.done-msg.on{display:flex}
.done-msg svg{width:26px;height:26px}.done-msg circle,.done-msg path{fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80}
.done-msg.on circle,.done-msg.on path{animation:d .7s ease forwards}.done-msg.on path{animation-delay:.3s}
@keyframes d{to{stroke-dashoffset:0}}
.set{display:flex;gap:12px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:14px;margin-bottom:18px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{color:var(--mut);font-weight:500;text-align:left;padding:6px 4px}td{padding:6px 4px;border-top:1px solid var(--ln)}
td input{width:112px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:9;display:flex;flex-direction:column;gap:8px;width:min(92vw,380px)}
.t{background:var(--card);box-shadow:0 8px 30px rgba(0,0,0,.2);border-left:4px solid var(--ac);border-radius:12px;padding:12px 14px;cursor:pointer}
.t b{display:block}
</style>
</head>
<body>
<div id="toast"></div>
<main>
<h1>Workday</h1>
<div class="date" id="today"></div>

<div class="set">
 <span>Remind before break ends</span><select id="bw"><option value="5">5 min</option><option value="10">10 min</option></select>
 <span>before checkout</span><select id="ow"><option value="5">5 min</option><option value="10">10 min</option></select>
 <button class="s" id="perm">Enable notifications</button>
</div>

<section class="card">
 <h2>Workday</h2>
 <div class="row">
  <div><div class="big" id="inT">—</div><div class="lbl">Check In</div></div>
  <div><div class="big" id="outT">—</div><div class="lbl">Checkout</div></div>
  <div><div class="big" id="wRem">—</div><div class="lbl">Remaining</div></div>
 </div>
 <div class="bar" id="wBar"><i></i></div>
 <div class="meta"><span id="wPct">0%</span><span>9h 15m total · lunch included</span></div>
 <div class="done-msg" id="wDone"><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="12"/><path d="M8 14.5l4 4 8-9"/></svg>Workday Complete</div>
 <div class="btns">
  <button id="bIn">Check In</button><button class="s" id="bOut">Check Out</button>
  <label class="lbl" style="align-self:center">Edit check-in <input type="time" id="edIn"></label>
 </div>
</section>

<section class="card">
 <h2>Lunch Break</h2>
 <div class="row">
  <div><div class="big" id="boT">—</div><div class="lbl">Break Out</div></div>
  <div><div class="big" id="biT">—</div><div class="lbl" id="biL">Expected Break In</div></div>
  <div><div class="big" id="bRem">—</div><div class="lbl">Remaining</div></div>
 </div>
 <div class="bar" id="bBar"><i></i></div>
 <div class="meta"><span id="bPct">0%</span><span>45 min break</span></div>
 <div class="done-msg" id="bDone"><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="12"/><path d="M8 14.5l4 4 8-9"/></svg><span id="bDoneT">Break Complete</span></div>
 <div class="btns">
  <button id="bStart">Start Break</button><button class="s" id="bBack">Break In</button>
  <label class="lbl" style="align-self:center">Edit break out <input type="time" id="edBo"></label>
  <label class="lbl" style="align-self:center">Edit break in <input type="time" id="edBi"></label>
 </div>
</section>

<section class="card">
 <h2>Log</h2>
 <div class="tw"><table><thead><tr><th>Date</th><th>Check In</th><th>Break Out</th><th>Break In</th><th>Checkout</th></tr></thead><tbody id="log"></tbody></table></div>
</section>
</main>

<script>
const H=36e5,M=6e4,WORK=9.25*H,BRK=45*M,$=id=>document.getElementById(id);
let S={days:{},bw:10,ow:10};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('workday')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('workday',JSON.stringify(S))}catch(e){}};
const key=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const rec=k=>S.days[k]||(S.days[k]={n:{}});
const tm=ms=>ms?new Date(ms).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'—';
const hm=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1e3),p=n=>String(n).padStart(2,'0');return p(Math.floor(s/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60)};
const toVal=ms=>{if(!ms)return'';const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const fromVal=(k,v)=>{if(!v)return null;const[y,m,d]=k.split('-'),[h,mi]=v.split(':');return new Date(y,m-1,d,h,mi).getTime()};

function toast(title,body){
  const e=document.createElement('div');e.className='t';e.innerHTML='<b></b><span></span>';
  e.children[0].textContent=title;e.children[1].textContent=body;
  e.onclick=()=>e.remove();$('toast').appendChild(e);setTimeout(()=>e.remove(),12000);
  try{if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body})}catch(e){}
}
function once(t,f,title,body){if(t.n[f])return;t.n[f]=1;save();toast(title,body)}

function renderLog(){
  const ks=Object.keys(S.days).sort().reverse();
  $('log').innerHTML=ks.map(k=>{
    const[y,m,d]=k.split('-'),r=S.days[k];
    const c=f=>`<td><input type="time" data-k="${k}" data-f="${f}" value="${toVal(r[f])}"></td>`;
    return`<tr><td>${new Date(y,m-1,d).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'})}</td>${c('in')}${c('bo')}${c('bi')}${c('out')}</tr>`;
  }).join('')||'<tr><td colspan="5" class="lbl">No records yet.</td></tr>';
}
function set(bar,pct,done){bar.classList.toggle('done',done);bar.firstElementChild.style.width=(pct*100)+'%'}

let curKey=key();
function tick(){
  const now=Date.now(),k=key();
  if(k!==curKey){curKey=k;renderLog()}
  $('today').textContent=new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  const t=S.days[k]||{n:{}};

  // Workday
  $('inT').textContent=tm(t.in);
  if(t.in){
    const end=t.in+WORK,left=end-now,pct=Math.min(1,Math.max(0,(now-t.in)/WORK)),done=left<=0||!!t.out;
    $('outT').textContent=tm(end);
    $('wRem').textContent=done?'00:00:00':hm(left);
    set($('wBar'),done?1:pct,done);
    $('wPct').textContent=Math.round((done?1:pct)*100)+'% completed';
    $('wDone').classList.toggle('on',done);
    $('wDone').lastChild.textContent=t.out?'Workday Complete · out '+tm(t.out):'Workday Complete';
    if(!t.out){
      if(left>0&&left<=S.ow*M)once(t,'ow','Almost time to leave 🎉','Your checkout time is in '+Math.ceil(left/M)+' minutes.');
      if(left<=0&&-left<5*M)once(t,'od','✓ Workday Complete','It\u2019s checkout time.');
    }
  }else{
    $('outT').textContent='—';$('wRem').textContent='—';set($('wBar'),0,false);$('wPct').textContent='0%';$('wDone').classList.remove('on');
  }
  $('bIn').disabled=!!t.in;$('bOut').disabled=!t.in||!!t.out;
  if(document.activeElement!==$('edIn'))$('edIn').value=toVal(t.in);

  // Break
  $('boT').textContent=tm(t.bo);
  if(t.bo){
    const end=t.bo+BRK,ref=t.bi||now,pct=Math.min(1,Math.max(0,(ref-t.bo)/BRK)),left=end-now,over=!t.bi&&left<=0;
    $('biL').textContent=t.bi?'Break In':'Expected Break In';
    $('biT').textContent=tm(t.bi||end);
    $('bRem').textContent=t.bi?'Ended':hm(left);
    set($('bBar'),pct,pct>=1);
    $('bPct').textContent=Math.round(pct*100)+'%';
    const showDone=over||(t.bi&&pct>=1);
    $('bDone').classList.toggle('on',!!showDone);
    $('bDoneT').textContent=t.bi?'Break Complete':'Break Complete · Time to Check In';
    if(!t.bi){
      if(left>0&&left<=S.bw*M)once(t,'bw','Break ending soon 🍴','Your break ends in '+Math.ceil(left/M)+' minutes. Time to head back.');
      if(left<=0&&-left<5*M)once(t,'bd','Break Complete','Time to check back in.');
    }
  }else{
    $('biT').textContent='—';$('bRem').textContent='—';set($('bBar'),0,false);$('bPct').textContent='0%';$('bDone').classList.remove('on');
  }
  if(document.activeElement!==$('edBo'))$('edBo').value=toVal(t.bo);
  if(document.activeElement!==$('edBi'))$('edBi').value=toVal(t.bi);
  const onBreak=t.bo&&!t.bi;
  $('bStart').disabled=!!onBreak;$('bBack').disabled=!onBreak;
}

$('bIn').onclick=()=>{const t=rec(key());t.in=Date.now();t.n={};save();renderLog();tick()};
$('bOut').onclick=()=>{rec(key()).out=Date.now();save();renderLog();tick()};
$('bStart').onclick=()=>{const t=rec(key());t.bo=Date.now();t.bi=null;delete t.n.bw;delete t.n.bd;save();renderLog();tick()};
$('bBack').onclick=()=>{rec(key()).bi=Date.now();save();renderLog();tick()};
$('edIn').onchange=e=>{const k=key(),t=rec(k);t.in=fromVal(k,e.target.value);delete t.n.ow;delete t.n.od;save();renderLog();tick()};
$('edBo').onchange=e=>{const k=key(),t=rec(k);t.bo=fromVal(k,e.target.value);delete t.n.bw;delete t.n.bd;save();renderLog();tick()};
$('edBi').onchange=e=>{const k=key(),t=rec(k);t.bi=fromVal(k,e.target.value);save();renderLog();tick()};
$('log').onchange=e=>{const i=e.target;if(!i.dataset.k)return;const t=rec(i.dataset.k);t[i.dataset.f]=fromVal(i.dataset.k,i.value);
  if(i.dataset.f==='in'){delete t.n.ow;delete t.n.od}if(i.dataset.f==='bo'){delete t.n.bw;delete t.n.bd}save();tick()};
$('bw').value=S.bw;$('ow').value=S.ow;
$('bw').onchange=e=>{S.bw=+e.target.value;save()};$('ow').onchange=e=>{S.ow=+e.target.value;save()};
function permUI(){const ok='Notification' in window;$('perm').textContent=!ok?'Notifications unsupported (in-app alerts on)':Notification.permission==='granted'?'Notifications on ✓':'Enable notifications';$('perm').disabled=!ok||Notification.permission==='granted'}
$('perm').onclick=async()=>{try{await Notification.requestPermission()}catch(e){toast('Notifications blocked','Using in-app alerts instead.')}permUI()};
permUI();renderLog();tick();setInterval(tick,1000);
</script>
</body>
</html>
